  <style>

    :root {
      --bg-main: #0b1f3a;
      --bg-card: #132b4f;
      --bg-card-2: #173661;
      --accent: #3f8cff;
      --text-main: #e8f0ff;
      --text-muted: #9fb7dc;
      --border: #264b7a;
    }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    .top-header {
      background: linear-gradient(135deg, #132b4f, #173661);
      border-bottom: 1px solid var(--border);
      padding: 20px;
    }

    .headline {
      font-size: 2rem;
      font-weight: bold;
    }

    .logo-box {
      width: 90px;
      height: 90px;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .main-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .toolbar .btn {
      border-radius: 12px;
      padding: 10px 18px;
      font-weight: 600;
    }

    .btn-custom {
      background: var(--accent);
      border: none;
      color: white;
    }

    .btn-custom:hover {
      background: #67a5ff;
    }

    .date-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
    }

    .form-control,
    .form-select {
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    .form-control:focus,
    .form-select:focus {
      background: var(--bg-card-2);
      color: var(--text-main);
      border-color: var(--accent);
      box-shadow: 0 0 0 0.2rem rgba(63,140,255,0.2);
    }

    table {
      color: var(--text-main) !important;
    }

    .table thead {
      background: #214679;
    }

    .table tbody tr:hover {
      background: rgba(255,255,255,0.5);
    }

    .win-cell {
        background: #179d48 !important;
        color: white !important;
    }
    

    .cell-link {
      display: block;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      color: inherit;
      background: inherit;
      text-decoration: none;
    }

    .centered {
      text-align: center;
    }

    .righted {
      text-align: right;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .stat-box {
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    .stat-title {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .section-title {
      font-size: 1.1rem;
      margin-bottom: 15px;
      font-weight: bold;
    }
    .mobile-only {

        align-items: stretch;

      .toolbar {

      }

      .mobile-only {
        display: block;
      }

  async function fLoadTableData() {

      fShowDailyTableStatus(`Nahrávám data...`);
      // sample rows
      // loads data from Google Sheets API
      const response = await fetch(API_URL);
      const data = await response.json();

      if (!data || data.length === 0) {
          fShowDailyTableStatus(`Nebyla nalezena žádná data.`);
          return;
      }

    const dxlStats={};
    Object.keys(data).forEach(k => {
        sDate = k.slice(0,6);
        if (!dxlStats[sDate]) {
          dxlStats[sDate] = [Math.round(data[sDate + '-iWinValue']*100)/100, data[sDate + '-iWinCount'], data[sDate + '-iWinMax'], data[sDate + '-lstMatches'] ? data[sDate + '-lstMatches'].length : 0];
        }
      });

      localStorage.setItem("data", JSON.stringify(data));
      localStorage.setItem("stats", JSON.stringify(dxlStats));
      fMonthlyTableData();
    
    }

function fDailyTableData(sDate) {

    //const selectedDate =
    //    document.getElementById("datePicker").value.replaceAll("-", "").slice(2);

    const selectedDate = sDate.split('.').reverse().join('').slice(2);
  


    //const sDate = selectedDate.slice(4,6) + "." + selectedDate.slice(2,4) + ".20" + selectedDate.slice(0,2);
  //  const sDate = fGetFullDate(document.getElementById("datePicker").value);
    


    document.getElementById("table-head").innerText =
        `Fotbalové zápasy ${sDate}:`;
      
    let data = JSON.parse(localStorage.getItem("data")) || [];
    let stats = JSON.parse(localStorage.getItem("stats")) || [];
    
    stats = stats[selectedDate] || [0, 0, 0, 0];
    data = data[selectedDate + '-lstMatches'] || [];
    
    if (!data || data.length === 0) {
          fShowDailyTableStatus(`Pro datum ${sDate} nebyla nalezena žádná data.`);
          return;
      }

    data.forEach(r => {
        const date = new Date(r[1]);
        r[1] = date.toLocaleString("cs-CZ", {
        hour: "2-digit",
        minute: "2-digit"
        });
    });

   // sort by col time
    data.sort((a, b) => {
        return a[1].localeCompare(b[1]);
    });

      fRenderDailyTable(data, sDate);
      renderStats(data, stats);

      fShowDailyTable();
  }

function fMonthlyTableData() {

    const selectedMonth =
        document.getElementById("monthPicker").value.replaceAll("-", "").slice(2);

    //const sDate = selectedDate.slice(4,6) + "." + selectedDate.slice(2,4) + ".20" + selectedDate.slice(0,2);
  const sMonth = document.getElementById("monthPicker").value ? new Date(document.getElementById("monthPicker").value + "-01").toLocaleString("cs-CZ", {
        month: "long",
        year: "numeric",
      }) : "";

    document.getElementById("table-head").innerText =
        `Fotbalové zápasy ${sMonth}:`;
      
    let stats = JSON.parse(localStorage.getItem("stats")) || [];
    // converts to matrix and filters for selected month
    stats = Object.entries(stats).map(([key, arr]) => [key, ...arr]);
    
// filter stats for selected month and sort by date desc
    stats = stats.filter(s => s[0].slice(0,4) === selectedMonth).sort((a, b) => a[0] - b[0]);
    //stats = Object.keys(stats).filter(k => k.slice(0,4) === selectedMonth).map(k => stats[k]).sort((a, b) => b[3] - a[3]);
    
    
    if (!stats || stats.length === 0) {
          fShowDailyTableStatus(`Pro měsíc ${sMonth} nebyla nalezena žádná data.`);
          return;
      }

    stats.forEach(r => {
        r[0] = r[0].slice(4,6) + "." + r[0].slice(2,4) + ".20" + r[0].slice(0,2);
        });

   

      fRenderMonthlyTable(stats);

      fShowMonthlyTable();
  }




    function fGetFullDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleString("cs-CZ", {
        weekday: "long",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
      });
    }

    // ============================================
    // RENDER TABLE
    // ============================================

    function copyIconInCell(content, cell) {
      const copyIcon = document.createElement("span");
      copyIcon.textContent = "📋";
      copyIcon.style.cursor = "pointer";
      copyIcon.style.marginLeft = "5px";
      copyIcon.title = "Kopírovat";

      

      copyIcon.addEventListener("click", () => {
        navigator.clipboard.writeText(content.trim());
        //alert("Zkopírováno: " + content.trim());
        // Select the cell content when the copy icon is clicked
        const range = document.createRange();
        range.selectNodeContents(cell);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      
      });

      cell.appendChild(copyIcon);
    }

    function createCell(content, bCopyCol = 2, isWin=false, isHeader = false, sClass = "", sLink = "") {
      const cell = document.createElement(isHeader ? "th" : "td");
      cell.textContent = content;

      if (sLink) {
        const link = document.createElement("a"); 
        link.href = sLink;
        link.classList.add("cell-link");
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.appendChild(cell);
        return link;
      }
      if (sClass) {
        cell.classList.add(sClass);
      }
      if (!isHeader && bCopyCol) {
        copyIconInCell(content, cell);
      }
      if (isWin) {
        cell.classList.add("win-cell");
      }
      return cell;
    }

    function fRenderMonthlyTable(rows) {

      const tbody =
        document.getElementById("monthlyTableBody");

      tbody.innerHTML = "";
      let iR=0
      rows.forEach(r => {
        iR++;
        const tr = document.createElement("tr");

        tr.appendChild(createCell(r[0], false, false, false, 'centered'));

        const iWinValue = r[1];
        const iWinCount = r[2];
        const iWinMax = r[3];
        const iTipsCount = r[4];
        

        const sCountWin = iTipsCount ? `${iWinCount} / ${iTipsCount} (${fMathRound(iWinCount / iTipsCount * 100, 2)}%)` : '-';
        const sTotalWin = iTipsCount ? `${iWinValue} / ${iTipsCount} (${fMathRound(iWinValue / iTipsCount * 100, 2)}%)` : '-';
        const sTotalWinWithoutBestTip = iTipsCount > 1 ? `${fMathRound(iWinValue - iWinMax, 2)} / ${iTipsCount - 1} (${fMathRound((iWinValue - iWinMax) / (iTipsCount - 1) * 100, 2)}%)` : '-';
        
        tr.appendChild(createCell(sCountWin, false, false, false, 'centered'));
        tr.appendChild(createCell(sTotalWin, false, (iWinValue > 0), false, 'centered'));
        tr.appendChild(createCell(sTotalWinWithoutBestTip, false, false, false, 'centered'));  
        let cellDetail = createCell("detail", false, false, false, 'centered');
        cellDetail.innerHTML = `<a href="#" onclick="fDailyTableData('${r[0]}'); return false;">Detail</a>`;
        tr.appendChild(cellDetail);  
         

        tbody.appendChild(tr);
      });

      //document.getElementById("tableInfo").innerText =
      //  rows.length + " řádků načteno";
    }


    // ============================================
    // RENDER STATS
    // ============================================

    function renderStats(rows, lstStats) {

      const iWinValue = lstStats[0];
      const iWinCount = lstStats[1];
      const iWinMax = lstStats[2];

      const sCountWin = rows.length ? `${iWinCount} / ${rows.length} (${fMathRound(iWinCount / rows.length * 100, 2)}%)` : '-';
      const sTotalWin = rows.length ? `${iWinValue} / ${rows.length} (${fMathRound(iWinValue / rows.length * 100, 2)}%)` : '-';
      const sTotalWinWithoutBestTip = rows.length > 1 ? `${fMathRound(iWinValue - iWinMax, 2)} / ${rows.length - 1} (${fMathRound((iWinValue - iWinMax) / (rows.length - 1) * 100, 2)}%)` : '-';
            
      document.getElementById("countWin").innerText = sCountWin;
      document.getElementById("totalWin").innerText = sTotalWin;
      document.getElementById("totalWinWithoutBestTip").innerText = sTotalWinWithoutBestTip;
    }


    function fMathRound(value, decimals) {
      return Number(Math.round(value + 'e' + decimals) + 'e-' + decimals);
    }

    function fRenderDailyTable(rows, selectedDate) {

      const tbody =
        document.getElementById("dailyTableBody");

      tbody.innerHTML = "";
      let iR=0
      rows.forEach(r => {
        iR++;
        const tr = document.createElement("tr");

        tr.appendChild(createCell(iR, false, false, false, 'righted'));
        tr.appendChild(createCell(r[1], false, false, false, 'centered'));
        tr.appendChild(createCell(r[0], false, false, false, ''));
        tr.appendChild(createCell(r[2], true, false, false, ''));

        tr.appendChild(createCell(r[3], false, (r[7] === 1), false, 'centered'));
        tr.appendChild(createCell(r[4], false, (r[7] === 0), false, 'centered'));
        tr.appendChild(createCell(r[5], false, (r[7] === 2), false, 'centered'));   
        if (r[6] == ":" || r[6] == "") {
          const sTeams = r[2].replaceAll(' Ž', ' W').replaceAll(' ','+')
          let cellDetail = createCell("detail", false, false, false, 'centered');
          const sLink = `https://www.google.com/search?q=site%3Asofascore.com+${sTeams}+score+${selectedDate}`;
          cellDetail.innerHTML = `<a href="${sLink}" target="_blank">Score</a>`;
          tr.appendChild(cellDetail); 
        } else {
          tr.appendChild(createCell(r[6], false, false, false, 'centered'));
        }

        tbody.appendChild(tr);
      });

      //document.getElementById("tableInfo").innerText =
      //  rows.length + " řádků načteno";
    }


    // ============================================

    // ============================================

    function renderStats(rows, lstStats) {

      const iWinValue = lstStats[0];

      const sCountWin = rows.length ? `${iWinCount} / ${rows.length} (${fMathRound(iWinCount / rows.length * 100, 2)}%)` : '-';
      const sTotalWin = rows.length ? `${iWinValue} / ${rows.length} (${fMathRound(iWinValue / rows.length * 100, 2)}%)` : '-';
      const sTotalWinWithoutBestTip = rows.length > 1 ? `${fMathRound(iWinValue - iWinMax, 2)} / ${rows.length - 1} (${fMathRound((iWinValue - iWinMax) / (rows.length - 1) * 100, 2)}%)` : '-';
            
      document.getElementById("countWin").innerText = sCountWin;
      document.getElementById("totalWin").innerText = sTotalWin;
      document.getElementById("totalWinWithoutBestTip").innerText = sTotalWinWithoutBestTip;
    }

    function fShowDailyTableStatus(msg) {

        document.getElementById("tableStatus")
            .innerText = msg;

        document.getElementById("dailyTableContainer")

    function init() {

      const today = new Date()
        .toISOString()
