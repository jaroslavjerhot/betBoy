
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>betBoy</title>
  <link rel="icon" href="/img/favicon_letter_16.png" type="image/png">

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>

    :root {
      --bg-main: #0b1f3a;
      --bg-card: #132b4f;
      --bg-card-2: #173661;
      --accent: #3f8cff;
      --text-main: #e8f0ff;
      --text-muted: #9fb7dc;
      --border: #264b7a;
    }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    .top-header {
      background: linear-gradient(135deg, #132b4f, #173661);
      border-bottom: 1px solid var(--border);
      padding: 20px;
    }

    .headline {
      font-size: 2rem;
      font-weight: bold;
    }

    .logo-box {
      width: 90px;
      height: 90px;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .main-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .toolbar .btn {
      border-radius: 12px;
      padding: 10px 18px;
      font-weight: 600;
    }

    .btn-custom {
      background: var(--accent);
      border: none;
      color: white;
    }

    .btn-custom:hover {
      background: #67a5ff;
    }

    .date-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
    }

    .form-control,
    .form-select {
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    .form-control:focus,
    .form-select:focus {
      background: var(--bg-card-2);
      color: var(--text-main);
      border-color: var(--accent);
      box-shadow: 0 0 0 0.2rem rgba(63,140,255,0.2);
    }

    table {
      color: var(--text-main) !important;
    }

    .table thead {
      background: #214679;
    }

    .table tbody tr:hover {
      background: rgba(255,255,255,0.05);
    }

    .win-cell {
        background: #179d48 !important;
        color: white !important;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .stat-box {
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    .stat-title {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .section-title {
      font-size: 1.1rem;
      margin-bottom: 15px;
      font-weight: bold;
    }

    @media (max-width: 768px) {

      .headline {
        font-size: 1.5rem;
      }

      .top-header {
        text-align: center;
      }

      .header-row {
        flex-direction: column;
        gap: 15px;
      }

      .date-panel {
        flex-direction: column;
        align-items: stretch;
      }

      .toolbar {
        justify-content: center;
      }
    }

  </style>
</head>
<body>

  <div class="container-fluid p-3 p-lg-4">
    <img src="img/logo_mobile_60.png" alt="Logo">
    <!-- HEADER -->
    <!-- <div class="top-header rounded-4 mb-4">
        
      
    </div> -->


    <!-- BUTTON BAR -->
    <div class="main-card mb-4">

      <!-- <div class="section-title">Actions</div> -->

      <div class="toolbar" id="toolbarButtons">
        <a href="https://www.oddsportal.com/matches/football/yesterday/" target="_blank" rel="noopener noreferrer">
          <button class="btn btn-custom">OddsPortal-včera</button>
        </a>
        <a href="https://www.oddsportal.com/matches/football/tomorrow/" target="_blank" rel="noopener noreferrer">
          <button class="btn btn-custom">OddsPortal-zítra</button>
        </a>
        <a href="https://www.tipsport.cz/kurzy/fotbal-16?timeFilter=form.period.tomorrow" target="_blank" rel="noopener noreferrer">
          <button class="btn btn-custom">Tipsport-zítra</button>
        </a>
        

      </div>

    </div>


    <!-- DATE FILTER -->
    <div class="main-card mb-4">

      <!-- <div class="section-title">Date Filter</div> -->

      <div class="date-panel">

        <div>
          <label class="form-label">Rychlý výběr</label>
          <select class="form-select" id="rangePicker">
            <option value="yesterday">Včera</option>
            <option value="today">Dnes</option>
            <option value="tomorrow">Zítra</option>
          </select>
        </div>
        
        <div>
          <label class="form-label">Datum</label>
          <input
            type="date"
            class="form-control"
            id="datePicker"
          >
        </div>

        <div class="align-self-end">
          <button class="btn btn-custom" onclick="loadTableData()">
            Načíst data z betBoy API
          </button>
        </div>

      </div>

    </div>


<!-- STATS -->
    <div class="main-card">

      <div class="section-title">Statistiky</div>

      <div class="stats-grid">

        <div class="stat-box">
          <div class="stat-title">Celkem zápasů</div>
          <div class="stat-value" id="statRows">0</div>
        </div>

        <div class="stat-box">
          <div class="stat-title">Celkem zápasů</div>
          <div class="stat-value" id="statRows2">0</div>
        </div>

        <div class="stat-box">
          <div class="stat-title">ROI</div>
          <div class="stat-value" id="statSuccess">0%</div>
        </div>

      </div>

    </div>

    <div class="my-4"></div>
    <!-- TABLE -->
    <div class="main-card mb-4">

      <div class="d-flex justify-content-between align-items-center mb-3">

        <div class="section-title mb-0" id="table-head">Fotbalové zápasy</div>

        <!-- <div class="text-secondary" id="tableInfo">
          žádná data
        </div> -->

      </div>
        <div
            id="tableStatus"
            class="text-center py-5 fs-5 text-info"
            style="display:none;"
        >
            Nahrávám data...
        </div>

        <div class="table-responsive" id="tableContainer">

        <table class="table table-dark table-hover align-middle">

          <thead>
            <tr>
              <th>Čas</th>
              <th>Liga</th>
              <th>Týmy</th>
              <th>1</th>
              <th>0</th>
              <th>2</th>
              <th>Skóre</th>
            </tr>
          </thead>

          <tbody id="tableBody">
          </tbody>

        </table>

      </div>

    </div>


    

  </div>


  <script>

    // ============================================
    // SAMPLE DATA LOADER
    // replace by Google Sheets API later
    // ============================================

    const API_URL =
            "https://script.google.com/macros/s/AKfycbxPsVhgqZzApMZa1Q9PY1mUrFkdmvGr0mPTR-ajXwChB-ZNXq52uTDwOrJlGeEu4x7SQg/exec";


    async function loadTableData() {

        

    const selectedDate =
        document.getElementById("datePicker").value.replaceAll("-", "").slice(2);

    //const sDate = selectedDate.slice(4,6) + "." + selectedDate.slice(2,4) + ".20" + selectedDate.slice(0,2);
    const sDate = fGetFullDate(document.getElementById("datePicker").value);
    
    document.getElementById("table-head").innerText =
        `Fotbalové zápasy ${sDate}:`;

      console.log("Loading for:", selectedDate);
    
      showTableStatus(`Nahrávám data - fotbalové zápasy ${sDate}...`);
      // sample rows
      // loads data from Google Sheets API
      const response = await fetch(API_URL + '?date=' + selectedDate);
      const data = await response.json();

      if (!data || data.length === 0) {
          showTableStatus(`Pro datum ${sDate} nebyla nalezena žádná data.`);
          return;
      }

      const iWin = data[data.length-1][0]
      //remove last row with totals
      data.pop();

      // set time for col 1
    data.forEach(r => {
        const date = new Date(r[1]);
        r[1] = date.toLocaleString("cs-CZ", {
        hour: "2-digit",
        minute: "2-digit"
        });
    });

    // sort by col 0 and 1
    //data.sort((a, b) => {
    //    if (a[0] === b[0]) {
    //    return a[1].localeCompare(b[1]);
    //    }
    //    return a[0].localeCompare(b[0]);
    //});

    // sort by col 0 and 1
    data.sort((a, b) => {
        return a[1].localeCompare(b[1]);
    });

      renderTable(data);
      renderStats(data, iWin);

      showTable();
    }

    function fGetFullDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleString("cs-CZ", {
        weekday: "long",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
      });
    }

    // ============================================
    // RENDER TABLE
    // ============================================

    function copyIconInCell(content, cell) {
      const copyIcon = document.createElement("span");
      copyIcon.textContent = "📋";
      copyIcon.style.cursor = "pointer";
      copyIcon.style.marginLeft = "5px";
      copyIcon.title = "Kopírovat";

      copyIcon.addEventListener("click", () => {
        navigator.clipboard.writeText(content.trim());
        alert("Zkopírováno: " + content.trim());
      });

      cell.appendChild(copyIcon);
    }

    function createCell(content, iCopyCol = 2, isWin=false, isHeader = false) {
      const cell = document.createElement(isHeader ? "th" : "td");
      cell.textContent = content;
      if (!isHeader && iCopyCol === 2) {
        copyIconInCell(content, cell);
      }
      if (isWin) {
        cell.classList.add("win-cell");
      }
      return cell;
    }


    function renderTable(rows, iWin) {

      const tbody =
        document.getElementById("tableBody");

      tbody.innerHTML = "";

      rows.forEach(r => {

        const tr = document.createElement("tr");

        tr.appendChild(createCell(r[1], 1));
        tr.appendChild(createCell(r[0], 0));
        tr.appendChild(createCell(r[2], 2));   

        tr.appendChild(createCell(r[3], 3, (r[7] === 1)));
        tr.appendChild(createCell(r[4], 4, (r[7] === 0)));
        tr.appendChild(createCell(r[5], 5, (r[7] === 2)));   
        tr.appendChild(createCell(r[6], 6));

        tbody.appendChild(tr);
      });

      //document.getElementById("tableInfo").innerText =
      //  rows.length + " řádků načteno";
    }


    // ============================================
    // RENDER STATS
    // ============================================

    function renderStats(rows, iWin) {

      const total = rows.length;

      const active =
        rows.filter(r => r.status === "OK").length;

      const errors =
        rows.filter(r => r.status === "ERROR").length;

      const success =
        total && iWin
          ? Math.round(iWin / total)  + "%"
          : '-';

      document.getElementById("statRows").innerText = total;
      //document.getElementById("statActive").innerText = active;
      //document.getElementById("statErrors").innerText = errors;
      document.getElementById("statSuccess").innerText = success;
    }


    // ============================================
    // INITIALIZE
    // ============================================

    document
        .getElementById("rangePicker")
        .addEventListener("change", function() {

            const val = this.value;

            const d = new Date();

            switch(val) {
                case "yesterday":
                    d.setDate(d.getDate() - 1);
                    break;
                case "tomorrow":
                    d.setDate(d.getDate() + 1);
                    break;
                // today = no change
            }

            const iso =
            d.toISOString().split("T")[0];

            document
            .getElementById("datePicker")
            .value = iso;
            }
        );

    function showTableStatus(msg) {

        document.getElementById("tableStatus")
            .innerText = msg;

        document.getElementById("tableStatus")
            .style.display = "block";

        document.getElementById("tableContainer")
            .style.display = "none";
    }
    
    function showTable() {

        document.getElementById("tableStatus")
            .style.display = "none";

        document.getElementById("tableContainer")
            .style.display = "block";
        }

    function init() {

      const today = new Date()
        .toISOString()
        .split("T")[0];

    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const yesterdayIso = yesterday.toISOString().split("T")[0];

      document.getElementById("datePicker").value = yesterdayIso;

      loadTableData();
    }

    init();

  </script>

</body>
</html>
